[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pixie-for-pm"
version = "0.1.0"
description = "Multi-agent product collaboration scaffold for Discord and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.18",
    "cryptography>=46.0.0",
    "deepagents>=0.5.3",
    "discord.py>=2.5.2",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langgraph>=0.4.7",
    "langgraph-checkpoint-sqlite>=2.0.6",
    "mcp>=1.27.0",
    "pixie-qa[all]>=0.8.4,<0.9.0",
    "supabase>=2.15.3",
    "uvicorn[standard]>=0.34.2",
]

[project.scripts]
pixie-pm = "pixie_for_pm.main:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["pixie_for_pm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["pixie_for_pm", "tests"]
strict = true
warn_unreachable = true
